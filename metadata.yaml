name: astrbot_plugin_multi_api_router
display_name: 多 API 模型路由
short_desc: 将多个 OpenAI 兼容 API 组合为可自动分配、健康跳过和失败降级的 AstrBot Provider。
desc: >-
  为 AstrBot 提供多上游模型路由与原生 Provider 接入能力，
  支持整体自动分配、指定上游、拖拽排序、健康检查跳过、
  连续失败暂停、主模型回退、工具能力筛选、模型思考开关与干净展示名。
help: >-
  功能：1. 整体自动分配与指定上游 Provider 2. 拖拽调整调用顺序
  3. 健康检查与失败降级 4. 工具调用能力筛选 5. 模型思考开关
  6. /模型路由状态 7. /模型路由检测 8. /模型路由绑定预览
  9. /模型路由恢复绑定
version: 1.3.3
author: AKIhunter
repo: https://github.com/AKIhunter/astrbot_plugin_multi_api_router
astrbot_version: ">=4.29.0"
social_link: https://github.com/AKIhunter
