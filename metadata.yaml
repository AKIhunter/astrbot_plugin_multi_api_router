name: astrbot_plugin_multi_api_router
display_name: 多 API 模型路由
short_desc: 将多个 OpenAI 兼容 API 组合为可自动分配、健康跳过和失败降级的 AstrBot Provider。
desc: >-
  为 AstrBot 提供多上游模型路由与原生 Provider 接入能力，
  统一错误分类与处置，同上游按类别重试（默认一次）并优先遵守 Retry-After，
  健康检测或真实调用成功都会解除健康跳过，指定上游不受跳过影响；
  支持整体自动分配、指定上游、拖拽排序、路由总超时、API 类型分类、
  连续失败统计、主模型回退、工具能力筛选、模型思考开关与干净展示名。
help: >-
  功能：1. 整体自动分配与指定上游 Provider 2. 拖拽调整调用顺序
  3. 统一错误分类、按类重试与 Retry-After 4. 健康检查跳过与真实成功自动解除
  5. 429 限流 received/resolved/route 三段留痕 6. 路由总超时与主模型回退
  7. /模型路由状态 8. /模型路由检测 9. /模型路由绑定预览 10. /模型路由恢复绑定
version: 1.3.4
author: AKIhunter
repo: https://github.com/AKIhunter/astrbot_plugin_multi_api_router
astrbot_version: ">=4.29.0"
social_link: https://github.com/AKIhunter
tags:
  - 模型路由
  - API
  - Provider
  - WebUI
views:
  - name: upstreams
    description: 管理上游、优先级与健康检查结果
